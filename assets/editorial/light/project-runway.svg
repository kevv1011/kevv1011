<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="244" viewBox="0 0 1000 244" role="img" aria-labelledby="title"><title id="title">Runway project — Justine Kevin M. Reyes</title><rect width="1000" height="244" fill="#ffffff"/><text x="38" y="29" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">NEW / WEB + ANDROID / WALLET</text><text x="38" y="69" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="29" font-weight="600" >Runway</text><text x="38" y="107" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >A calmer way to track available money, savings and spending.</text><text x="38" y="137" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Private local data, a weekly chart and a real Android widget.</text><text x="38" y="188" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="400" >React · Vite · Capacitor · Android · Work in progress</text><text x="962" y="188" fill="#8a5a18" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="end">Explore repository ↗</text><path d="M38 218H962" stroke="#c9d2dc" stroke-width="1" fill="none"/></svg>
