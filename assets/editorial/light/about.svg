<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title"><title id="title">about — Justine Kevin M. Reyes</title><rect width="1000" height="365" fill="#ffffff"/><text x="38" y="57" fill="#17212e" font-family="Consolas,Menlo,monospace" font-size="40" font-weight="400" >01</text><text x="116" y="49" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="600" letter-spacing="3">ABOUT</text><path d="M360 43H777" stroke="#c9d2dc" stroke-width="1" fill="none"/><text x="962" y="48" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="400" text-anchor="end">~/01-about</text><path d="M38 83H962" stroke="#c9d2dc" stroke-width="1" fill="none"/><text x="38" y="125" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >I enjoy figuring out how complex systems work, then building practical software around them.</text><text x="38" y="159" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >My work spans the interface, the API, the database, and the cloud underneath.</text><path d="M38 206H962" stroke="#c9d2dc" stroke-width="1" fill="none"/><text x="38" y="230" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1.5">FOCUS</text><text x="193" y="230" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Backend APIs · Full-stack apps · Cloud</text><text x="38" y="275" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1.5">APPROACH</text><text x="193" y="275" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Clear interfaces. Reliable foundations.</text><text x="38" y="320" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1.5">LOCATION</text><text x="193" y="320" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Angeles City, Pampanga, Philippines</text></svg>
