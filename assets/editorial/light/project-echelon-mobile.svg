<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">project Echelon Cycling — Justine Kevin M. Reyes</title><rect width="600" height="360" fill="#ffffff"/><text x="26" y="29" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">01 / FULL-STACK / CYCLING</text><text x="26" y="69" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Echelon Cycling</text><text x="26" y="107" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Plan rides with live weather and GPS.</text><text x="26" y="138" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Compare mapped road routes.</text><text x="26" y="169" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Google sign-in keeps each rider’s</text><text x="26" y="200" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >plans and setup separate.</text><text x="26" y="242" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >React · FastAPI · PostgreSQL</text><text x="26" y="266" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >Vercel · Render</text><text x="26" y="311" fill="#8a5a18" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" >Explore repository ↗</text><path d="M26 334H574" stroke="#c9d2dc" stroke-width="1" fill="none"/></svg>
