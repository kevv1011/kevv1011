<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-labelledby="title"><title id="title">map — Justine Kevin M. Reyes</title><rect width="1000" height="478" fill="#ffffff"/><text x="38" y="57" fill="#17212e" font-family="Consolas,Menlo,monospace" font-size="40" font-weight="400" >02</text><text x="116" y="49" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="600" letter-spacing="3">SYSTEM MAP</text><path d="M360 43H777" stroke="#c9d2dc" stroke-width="1" fill="none"/><text x="962" y="48" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="400" text-anchor="end">~/02-systems</text><path d="M38 83H962" stroke="#c9d2dc" stroke-width="1" fill="none"/><text x="38" y="118" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">ONE ENGINEERING FOCUS / THREE APPLICATIONS</text><rect x="275" y="145" width="450" height="76" fill="#f7f9fb" stroke="#c9d2dc" rx="3"/><text x="500" y="176" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle">RELIABILITY IN REAL CONDITIONS</text><text x="500" y="202" fill="#435264" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" text-anchor="middle">interface → service → persistence</text><path d="M500 221V248M187 248H813M187 248V275M500 248V275M813 248V275" stroke="#c9d2dc" stroke-width="1" fill="none"/><circle cx="187" cy="275" r="3" fill="#8a5a18"/><rect x="38" y="285" width="298" height="123" fill="#ffffff" stroke="#c9d2dc" rx="2"/><text x="56" y="321" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" >TindahanTrack</text><text x="56" y="353" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Offline workflows</text><text x="56" y="386" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="400" >React → Express → Neon</text><circle cx="500" cy="275" r="3" fill="#8a5a18"/><rect x="351" y="285" width="298" height="123" fill="#ffffff" stroke="#c9d2dc" rx="2"/><text x="369" y="321" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" >HAUPokemon</text><text x="369" y="353" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Distributed tracking</text><text x="369" y="386" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="400" >Capacitor → EC2 → RDS</text><circle cx="813" cy="275" r="3" fill="#8a5a18"/><rect x="664" y="285" width="298" height="123" fill="#ffffff" stroke="#c9d2dc" rx="2"/><text x="682" y="321" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" >Echelon Cycling</text><text x="682" y="353" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Weather &amp; GPS planning</text><text x="682" y="386" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="400" >React → FastAPI → Postgres</text><text x="38" y="449" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" >A clear interface is only the beginning. The data path matters just as much.</text></svg>
