<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">project inventory — Justine Kevin M. Reyes</title><rect width="600" height="360" fill="#ffffff"/><text x="26" y="29" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">01 / FULL-STACK / INVENTORY</text><text x="26" y="69" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >TindahanTrack</text><text x="26" y="107" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Stock tracking for neighborhood stores,</text><text x="26" y="138" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >even when the connection drops.</text><text x="26" y="169" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Optimistic updates, localStorage fallback,</text><text x="26" y="200" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >and automated deployment.</text><text x="26" y="242" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >React · Express · Neon PostgreSQL</text><text x="26" y="266" fill="#59697a" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >GitHub Actions</text><text x="26" y="311" fill="#8a5a18" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" >Explore repository ↗</text><path d="M26 334H574" stroke="#c9d2dc" stroke-width="1" fill="none"/></svg>
