<svg xmlns="http://www.w3.org/2000/svg" width="600" height="254" viewBox="0 0 600 254" role="img" aria-labelledby="title"><title id="title">about — Justine Kevin M. Reyes</title><rect width="600" height="492" fill="#ffffff"/><text x="26" y="57" fill="#17212e" font-family="Consolas,Menlo,monospace" font-size="40" font-weight="400" >01</text><text x="104" y="49" fill="#17212e" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="600" letter-spacing="3">ABOUT</text><path d="M26 83H574" stroke="#c9d2dc" stroke-width="1" fill="none"/><text x="26" y="125" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >I enjoy figuring out how complex systems work,</text><text x="26" y="158" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >then building practical software around them.</text><text x="26" y="191" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >My work spans the interface, the API,</text><text x="26" y="224" fill="#435264" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >the database, and the cloud underneath.</text></svg>
