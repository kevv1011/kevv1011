<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="244" viewBox="0 0 1000 244" role="img" aria-labelledby="title"><title id="title">project serverless — Justine Kevin M. Reyes</title><rect width="1000" height="244" fill="#0d1117"/><text x="38" y="29" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">04 / CLOUD / AUTOMATION</text><text x="38" y="69" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="29" font-weight="600" >Serverless EC2 Dashboard</text><text x="38" y="107" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >A focused interface for instance state checks and start/stop actions.</text><text x="38" y="137" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Lambda and API Gateway handle routine operations without an app server.</text><text x="38" y="188" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="400" >AWS Lambda · API Gateway · EC2 · HTML · JavaScript</text><text x="962" y="188" fill="#e8b76b" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="end">Ask about the architecture ↗</text><path d="M38 218H962" stroke="#38434f" stroke-width="1" fill="none"/></svg>
