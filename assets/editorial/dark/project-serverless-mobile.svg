<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">project serverless — Justine Kevin M. Reyes</title><rect width="600" height="360" fill="#0d1117"/><text x="26" y="29" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">04 / CLOUD / AUTOMATION</text><text x="26" y="69" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Serverless EC2 Dashboard</text><text x="26" y="107" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >A focused interface for instance checks</text><text x="26" y="138" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >and start/stop actions. Lambda and</text><text x="26" y="169" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >API Gateway handle routine operations</text><text x="26" y="200" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >without an application server.</text><text x="26" y="242" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >AWS Lambda · API Gateway · EC2</text><text x="26" y="266" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >HTML · JavaScript</text><text x="26" y="311" fill="#e8b76b" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" >Ask about the architecture ↗</text><path d="M26 334H574" stroke="#38434f" stroke-width="1" fill="none"/></svg>
