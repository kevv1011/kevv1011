<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="244" viewBox="0 0 1000 244" role="img" aria-labelledby="title"><title id="title">project data — Justine Kevin M. Reyes</title><rect width="1000" height="244" fill="#0d1117"/><text x="38" y="29" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">04 / BACKEND / DATA</text><text x="38" y="69" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="29" font-weight="600" >SQL &amp; Shell Collection</text><text x="38" y="107" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Normalized databases and small command-line tools for everyday workflows.</text><text x="38" y="137" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="400" >Salon scheduling, periodic-table lookups, and World Cup data.</text><text x="38" y="188" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="400" >PostgreSQL · SQL · Bash · Git</text><text x="962" y="188" fill="#e8b76b" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="end">Explore the collection ↗</text><path d="M38 218H962" stroke="#38434f" stroke-width="1" fill="none"/></svg>
