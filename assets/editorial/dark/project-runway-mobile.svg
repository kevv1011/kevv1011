<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">Runway project — Justine Kevin M. Reyes</title><rect width="600" height="360" fill="#0d1117"/><text x="26" y="29" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1">NEW / WEB + ANDROID / WALLET</text><text x="26" y="69" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="30" font-weight="600" >Runway</text><text x="26" y="107" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Track available money and savings.</text><text x="26" y="138" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Log expenses and find costly days.</text><text x="26" y="169" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >An Android widget puts your balance</text><text x="26" y="200" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >on the home screen.</text><text x="26" y="242" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >React · Vite · Capacitor · Android</text><text x="26" y="266" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="400" >Local data · Work in progress</text><text x="26" y="311" fill="#e8b76b" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" >Explore repository ↗</text><path d="M26 334H574" stroke="#38434f" stroke-width="1" fill="none"/></svg>
