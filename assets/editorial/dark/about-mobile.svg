<svg xmlns="http://www.w3.org/2000/svg" width="600" height="492" viewBox="0 0 600 492" role="img" aria-labelledby="title"><title id="title">about — Justine Kevin M. Reyes</title><rect width="600" height="492" fill="#0d1117"/><text x="26" y="57" fill="#eef1f5" font-family="Consolas,Menlo,monospace" font-size="40" font-weight="400" >01</text><text x="104" y="49" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="600" letter-spacing="3">ABOUT</text><path d="M26 83H574" stroke="#38434f" stroke-width="1" fill="none"/><text x="26" y="125" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >I enjoy figuring out how complex systems work,</text><text x="26" y="158" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >then building practical software around them.</text><text x="26" y="191" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >My work spans the interface, the API,</text><text x="26" y="224" fill="#b4bfcc" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" >the database, and the cloud underneath.</text><path d="M26 248H574" stroke="#38434f" stroke-width="1" fill="none"/><text x="26" y="272" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1.5">FOCUS</text><text x="26" y="301" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Backend APIs · Full-stack apps · Cloud</text><text x="26" y="348" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1.5">APPROACH</text><text x="26" y="377" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Clear interfaces. Reliable foundations.</text><text x="26" y="424" fill="#8e9cac" font-family="Consolas,Menlo,monospace" font-size="12" font-weight="500" letter-spacing="1.5">LOCATION</text><text x="26" y="453" fill="#eef1f5" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Angeles City, Pampanga, Philippines</text></svg>
